<h2>Lägg till nytt innehåll</h2>
<form id="newadd" (submit)="collectContent($event)">
  <label for="type">Typ:*</label>
  <select id="type" name="type" [(ngModel)]="type">
    <option value="appetizers">Förrätt</option>
    <option value="main_courses">Huvudrätt</option>
    <option value="desserts">Dessert</option>
    <option value="drinks">Dryck</option>
  </select>
  <br />
  <label for="name">Namn:*</label>
  <input type="text" id="name" name="name" [(ngModel)]="newObjectName" />
  <br />
  @if (type === 'drinks') {
    <label for="category">Kategori:*</label>
    <select id="category" name="category" [(ngModel)]="newObjectCategory">
      <option value="red whine">Rödvin</option>
      <option value="white whine">Vitt vin</option>
      <option value="beer">Öl</option>
      <option value="sparkling whine">Mousserande</option>
      <option value="alcohol free">Alkoholfritt</option>
      <option value="coffee/tea">Kaffe/Te</option>
    </select>
  }
  <br />
  <label for="description">Beskrivning:*</label>
  <textarea id="description" name="description" [(ngModel)]="newObjectDescription"></textarea>
  <br />
  <label for="price">Pris:*</label>
  <input type="number" id="price" name="price" [(ngModel)]="newObjectPrice" />
  <button id="addproduct">Lägg till</button>
</form>
