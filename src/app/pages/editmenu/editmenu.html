<h2>Ändra innehåll</h2>
<form id="editmenu">
  <label for="type">Typ:*</label>
  <select id="type" name="type">
    <option value="appetizers">Förrätt</option>
    <option value="main_courses">Huvudrätt</option>
    <option value="desserts">Dessert</option>
    <option value="drinks">Dryck</option>
  </select>
  <br />
  <label for="name">Namn:*</label>
  <input type="text" id="name" name="name" />
  <br />
  <label for="category">Kategori:*</label>
  <select id="category" name="category">
    <option value="red whine">Rödvin</option>
    <option value="white whine">Vitt vin</option>
    <option value="beer">Öl</option>
    <option value="sparkling whine">Mousserande</option>
    <option value="alcohol free">Alkoholfritt</option>
    <option value="coffee/tea">Kaffe/Te</option>
  </select>
  <br />
  <label for="description">Beskrivning:*</label>
  <textarea id="description" name="description"></textarea>
  <br />
  <label for="price">Pris:*</label>
  <input type="number" id="price" name="price" />
  <button id="editproduct">Ändra</button>
</form>
